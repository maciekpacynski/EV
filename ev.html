const msVal = (r, k) => (k === "p" ? r.pd : k === "b" ? (r.b || "").replace(/\s*\(.*\)\s*$/, "") : r[k]);

function cmp(a, b, col) {
  if (col.type === "text") {
    const A = col.k === "p" ? a.p : a[col.k];
    const B = col.k === "p" ? b.p : b[col.k];
    return String(A).localeCompare(String(B), "pl", { numeric: true, sensitivity: "base" });
  }
  const A = a[col.k], B = b[col.k];
  return (A[0] - B[0]) || (A[1] - B[1]);
}
function visible() {
  const q = strip(state.q.trim());
  let out = ROWS.filter(r => {
    if (q && !q.split(/\s+/).every(w => r.all.includes(w))) return false;
    for (const k in state.fm) {
      const set = state.fm[k];
      if (set.size && !set.has(msVal(r, k))) return false;
    }
    for (const k in state.ft) {
      const f = strip(state.ft[k].trim());
      if (!f) continue;
      const hay = k === "p" ? strip(r.pd + " " + r.p) : k === "kraj" ? strip(r.kraj + " " + r.krajN) : strip(r[k]);
      if (!hay.includes(f)) return false;
    }
    for (const k in state.fn) {
      const { min, max } = state.fn[k];
      if (min === null && max === null) continue;
      const v = r[k];
      if (!v) return false;
      if (min !== null && v[1] < min) return false;
      if (max !== null && v[0] > max) return false;
    }
    return true;
  });
  if (state.sort) {
    const col = COLS.find(c => c.k === state.sort);
    const dir = state.dir;
    const isNum = col.type === "num";
    const empty = r => (isNum ? !r[col.k] : !(col.k === "p" ? r.p : r[col.k]));
    const bm = (a, b) => a.brand.localeCompare(b.brand, "pl", { numeric: true, sensitivity: "base" }) || a.model.localeCompare(b.model, "pl", { numeric: true, sensitivity: "base" }) || a.i - b.i;
    out = out.slice().sort((a, b) => {
      const ea = empty(a), eb = empty(b);
      if (ea || eb) return ea === eb ? bm(a, b) : ea ? 1 : -1;
      return cmp(a, b, col) * dir || bm(a, b);
    });
  }
  return out;
}

const HEAD_FONT = '600 12.5px "Barlow Semi Condensed", "Barlow", system-ui, sans-serif';

});

document.getElementById("wrap").addEventListener("scroll", () => msClose(false));
window.addEventListener("resize", () => { msClose(false); clearTimeout(window.__rz); window.__rz = setTimeout(layout, 120); });
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; rerender(); });
document.getElementById("reset").addEventListener("click", () => {
  state.sort = "brand"; state.dir = 1; state.q = ""; state.ft = {}; state.fn = {}; state.fm = {}; msClose(false); MULTI.forEach(msLabel);
  document.getElementById("q").value = "";
  document.querySelectorAll("#thead input").forEach(i => { i.value = ""; });
  render();
});
/* ---- opisy kolumn (dymki przy ikonie i) ---- */
const tipEl = document.createElement("div");
tipEl.id = "tip"; tipEl.setAttribute("role", "tooltip"); tipEl.hidden = true;
document.body.appendChild(tipEl);
let tipFor = null;
function tipShow(btn) {
  const t = TIPS[btn.dataset.tip]; if (!t) return;
  tipEl.innerHTML = "<b>" + esc(t[0]) + "</b>" + esc(t[1]);
  tipEl.hidden = false; tipFor = btn;
  const r = btn.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
  let y = r.bottom + 8; if (y + h > window.innerHeight - 8) y = Math.max(8, r.top - h - 8);
  tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
}
function tipHide() { tipEl.hidden = true; tipFor = null; }
const thd = document.getElementById("thead");
thd.addEventListener("mouseover", e => { const b = e.target.closest(".colinfo"); if (b) tipShow(b); });
thd.addEventListener("mouseout", e => { if (e.target.closest(".colinfo")) tipHide(); });
thd.addEventListener("focusin", e => { const b = e.target.closest(".colinfo"); if (b) tipShow(b); });
thd.addEventListener("focusout", e => { if (e.target.closest(".colinfo")) tipHide(); });
thd.addEventListener("click", e => { const b = e.target.closest(".colinfo"); if (b) { e.stopPropagation(); tipFor === b ? tipHide() : tipShow(b); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") tipHide(); });
window.addEventListener("scroll", tipHide, { passive: true });
document.addEventListener("click", e => { if (!e.target.closest(".colinfo")) tipHide(); });
loadState();
render();
</script>
</body>
